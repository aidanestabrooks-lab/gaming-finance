name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Weekdays at 12:30 UTC (07:30 ET): Treasury yields, FRED series and overnight
    # prediction-market quotes are posted by then. Refreshes the model data and redeploys.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh model data from public sources
        # Each source fails independently; a failed source keeps the snapshot committed in src/data.
        run: npm run data
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
